name: node_skill_integration_sweep_orchestrator
contract_name: node_skill_integration_sweep_orchestrator
node_name: node_skill_integration_sweep_orchestrator
contract_version: {major: 1, minor: 0, patch: 0}
node_version: {major: 1, minor: 0, patch: 0}
node_type: ORCHESTRATOR_GENERIC
description: Orchestrator node for the Gemini-native integration_sweep skill.
input_model: {name: ModelSkillRequest, module: omnigemini.shared.models}
